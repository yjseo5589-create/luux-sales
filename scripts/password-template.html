<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>LUUX 룩스ㅣ영업 관리</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#171717;font-family:Arial,'Apple SD Gothic Neo',sans-serif;-webkit-font-smoothing:antialiased}main{width:min(360px,calc(100% - 48px));margin:0 auto;padding:clamp(88px,20vh,180px) 0 48px}h1{margin:0 0 48px}h1 img{display:block;width:104px;height:auto;filter:brightness(0)}label{display:block;font-size:13px;color:#777;margin-bottom:8px}.field{position:relative}input{width:100%;height:40px;padding:0 56px 0 12px;border:1px solid #ccc;border-radius:2px;font:14px Arial,sans-serif;background:#fff;color:#171717}input:focus{outline:1px solid #171717;border-color:#171717}.visibility{position:absolute;right:6px;top:6px;height:28px;border:0;border-radius:2px;background:transparent;color:#777;font-size:12px;padding:0 6px;cursor:pointer}.visibility:hover{background:#f5f5f5;color:#171717}.submit{width:100%;height:40px;margin-top:16px;background:#171717;border:1px solid #171717;border-radius:2px;color:white;font-size:13px;font-weight:500;cursor:pointer}.submit:hover{background:#333}.submit:disabled{opacity:.65;cursor:wait}button:focus-visible{outline:2px solid #777;outline-offset:3px}.error{font-size:13px;line-height:1.6;color:#666;margin:12px 0 0;min-height:21px}@media(max-width:640px){input,.submit{height:44px}input{font-size:16px}.visibility{top:8px}}</style></head>
<body><main><h1><img src="/*[|logo_data|]*/0" alt="LUUX 영업 관리"></h1><form id="unlock" autocomplete="off"><label for="password">비밀번호</label><div class="field"><input id="password" type="password" required autocomplete="current-password" autofocus><button type="button" class="visibility" id="visibility" aria-label="비밀번호 표시" aria-pressed="false">보기</button></div><button type="submit" class="submit" id="submit">열기</button><p id="error" class="error" role="status" aria-live="polite"></p></form><noscript>사이트를 열려면 JavaScript를 활성화해 주세요.</noscript></main>
<script>
const initiator=/*[|js_staticrypt|]*/0;
const protectedConfig=/*[|staticrypt_config|]*/0;
const unlocker=initiator.init(protectedConfig,{});
const form=document.getElementById('unlock'),input=document.getElementById('password'),submit=document.getElementById('submit'),status=document.getElementById('error'),visibility=document.getElementById('visibility');
visibility.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';visibility.textContent=show?'숨기기':'보기';visibility.setAttribute('aria-label',show?'비밀번호 숨기기':'비밀번호 표시');visibility.setAttribute('aria-pressed',String(show));input.focus()});
input.addEventListener('input',()=>{status.textContent='';input.removeAttribute('aria-invalid')});
form.addEventListener('submit',async event=>{event.preventDefault();if(submit.disabled)return;submit.disabled=true;submit.textContent='확인 중';status.textContent='';try{if(!window.crypto?.subtle)throw Error('unsupported');const password=input.value;const result=await unlocker.handleDecryptionOfPage(password,false);if(!result.isSuccessful){input.value='';input.setAttribute('aria-invalid','true');status.textContent='비밀번호가 일치하지 않습니다.';input.focus()}}catch(error){status.textContent='페이지를 열지 못했습니다. 새로고침 후 다시 시도해 주세요.'}finally{submit.disabled=false;submit.textContent='열기'}});
// Do not auto-unlock from stored credentials, URL parameters or fragments.
</script></body></html>
